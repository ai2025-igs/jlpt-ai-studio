      }
    }

    // 綁定畫布滑鼠與觸控事件
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDraw);

    /* ═══════════════════════════════════════════════════════════════════ */
    /* ✏️ 所見即所得文字編輯模式 (WYSIWYG In-Place Edit Engine)          */
    /* ═══════════════════════════════════════════════════════════════════ */
    function toggleEditMode() {
      isEditMode = !isEditMode;
      if (isEditMode) {
        if (isDrawingMode) toggleDrawMode(); // 退出畫筆模式
        editBtn.classList.add('bg-cyan-600', 'text-white', 'border-cyan-500');
        editBtn.classList.remove('bg-slate-800', 'text-slate-300');
        showToast('✏️ 編輯模式已開啟：直接點擊任意文字即可修改！');
      } else {
        editBtn.classList.remove('bg-cyan-600', 'text-white', 'border-cyan-500');
        editBtn.classList.add('bg-slate-800', 'text-slate-300');
        showToast('✅ 編輯模式已關閉，內容已同步保存');
      }
      applyEditModeState();
    }

    function applyEditModeState() {
      const editableNodes = document.querySelectorAll('.editable-node');
      editableNodes.forEach(node => {
        if (isEditMode) {
          node.setAttribute('contenteditable', 'true');
          node.classList.add('editable-active');
          node.oninput = () => syncNodeEdit(node);
        } else {
          node.removeAttribute('contenteditable');
          node.classList.remove('editable-active');
        }
      });
    }

    function syncNodeEdit(node) {
      const s = slides[currentSlide];
      const field = node.getAttribute('data-field');
      const cardIdx = node.getAttribute('data-card-idx');
      const cardField = node.getAttribute('data-card-field');

      if (field === 'title') {
        s.title = node.innerText;
      } else if (field === 'subtitle') {
        s.subtitle = node.innerText;
      } else if (field === 'notes') {
        s.notes = node.innerHTML;
      } else if (cardIdx !== null && cardField) {
        const c = s.cards[parseInt(cardIdx, 10)];
        if (c) {
          if (cardField === 'title') c.title = node.innerText;
          else if (cardField === 'metric_value' && c.metric) c.metric.value = node.innerText;
          else if (cardField === 'metric_label' && c.metric) c.metric.label = node.innerText;
          else if (cardField === 'content') c.content = node.innerHTML;
          else if (cardField === 'diogenes') c.diogenes = node.innerText;
        }
      }
    }

    function exportUpdatedDeck() {
      saveCurrentSlideDrawing();
      const exportData = {
        title: deckData.title,
        subtitle: deckData.subtitle,
        category: deckData.category,
        slides: slides,
        drawings: slideDrawings
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${(deckData.title || 'deck').replace(/\s+/g, '_')}_updated_spec.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('💾 已下載更新後的簡報 JSON 規格檔！');
    }

    /* ═══════════════════════════════════════════════════════════════════ */
    /* 🧭 導航、分頁圓點與縮圖總覽                                        */
    /* ═══════════════════════════════════════════════════════════════════ */
    function initDots() {
      dotsEl.innerHTML = '';
      slides.forEach((_, idx) => {
        const dot = document.createElement('button');
        dot.className = `w-1.5 sm:w-2 h-1.5 sm:h-2 rounded-full transition-all duration-300 ${idx === currentSlide ? 'bg-cyan-400 w-4 sm:w-6' : 'bg-slate-700 hover:bg-slate-500'}`;
        dot.onclick = () => renderSlide(idx);
        dot.title = `第 ${idx + 1} 頁`;
        dotsEl.appendChild(dot);
      });
    }

    function updateDots() {
      const dots = dotsEl.children;
      for (let i = 0; i < dots.length; i++) {
        if (i === currentSlide) {
          dots[i].className = 'w-4 sm:w-6 h-1.5 sm:h-2 rounded-full bg-cyan-400 transition-all duration-300';
        } else {
          dots[i].className = 'w-1.5 sm:w-2 h-1.5 sm:h-2 rounded-full bg-slate-700 hover:bg-slate-500 transition-all duration-300';
        }
      }
    }

    function initOverview() {
      overviewGrid.innerHTML = '';
      slides.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = `p-3 rounded-lg border cursor-pointer transition flex flex-col justify-between ${idx === currentSlide ? 'bg-cyan-950/40 border-cyan-500' : 'bg-slate-900 border-slate-800 hover:border-slate-600'}`;
        item.innerHTML = `
          <div>
            <div class="text-[10px] font-mono text-cyan-400">Slide ${(idx + 1).toString().padStart(2, '0')}</div>
            <div class="text-xs font-bold text-white mt-1 line-clamp-2">${s.title}</div>
          </div>
          <div class="text-[10px] text-slate-500 mt-2 truncate">${s.category || ''}</div>
        `;
        item.onclick = () => {
          renderSlide(idx);
          toggleOverview();
        };
        overviewGrid.appendChild(item);
      });
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) renderSlide(currentSlide + 1);
    }

    function prevSlide() {
      if (currentSlide > 0) renderSlide(currentSlide - 1);
    }

    function toggleNotes() {
      notesDrawer.classList.toggle('translate-y-full');
    }

    function toggleOverview() {
      initOverview();
      overviewModal.classList.toggle('hidden');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // 鍵盤監聽事件 (EduSlide-Master 規範 + 編輯時防跳頁守衛)
    document.addEventListener('keydown', (e) => {
      // 🛡️ 防跳頁守衛：若使用者正在編輯文字或輸入框，絕對禁止觸發翻頁與快捷鍵！
      if (e.target && (e.target.isContentEditable || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
        if (e.key === 'Escape') {
          e.target.blur();
        }
        return; // 允許正常輸入空格、方向鍵、退格鍵！
      }

      if (!overviewModal.classList.contains('hidden')) {
        if (e.key === 'Escape' || e.key === 'o' || e.key === 'O') {
          toggleOverview();
        }
        return;
      }

      if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key === 'Home') {
        renderSlide(0);
      } else if (e.key === 'End') {
        renderSlide(slides.length - 1);
      } else if (e.key === 'e' || e.key === 'E') {
        toggleEditMode();
      } else if (e.key === 'd' || e.key === 'D') {
        toggleDrawMode();
      } else if (e.key === 'n' || e.key === 'N') {
        toggleNotes();
      } else if (e.key === 'o' || e.key === 'O') {
        toggleOverview();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      } else if ((e.key === 's' || e.key === 'S') && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        exportUpdatedDeck();
      }
    });

    // 初始化啟動
    document.addEventListener('DOMContentLoaded', () => {
      initDots();
      renderSlide(0);
    });
  </script>
</body>
</html>
